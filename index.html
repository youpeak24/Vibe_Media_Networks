<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Core SEO -->
    <title>Vibe Media Networks | Influencer Marketing & WFH Jobs India</title>
    <meta
      name="description"
      content="Vibe Media Networks is a digital talent scouting and influencer marketing agency in India. Apply for WFH, telecalling, part-time and freelance jobs."
    />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <meta name="author" content="Vibe Media Networks" />
    <meta name="theme-color" content="#0B1320" />
    <link rel="canonical" href="https://www.vibemedianetworks.com/" />

    <!-- Icons & app manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp, Slack previews) -->
    <meta property="og:site_name" content="Vibe Media Networks" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://www.vibemedianetworks.com/" />
    <meta
      property="og:title"
      content="Vibe Media Networks | Digital Talent & Media Scouting Agency"
    />
    <meta
      property="og:description"
      content="Digital talent scouting, influencer marketing campaigns, telecalling and work-from-home careers across India."
    />
    <meta
      property="og:image"
      content="https://www.vibemedianetworks.com/og-image.png"
    />
    <meta property="og:image:secure_url" content="https://www.vibemedianetworks.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Vibe Media Networks, a digital talent and media scouting agency"
    />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Vibe Media Networks | Digital Talent & Media Scouting Agency"
    />
    <meta
      name="twitter:description"
      content="Digital talent scouting, influencer marketing campaigns, telecalling and work-from-home careers across India."
    />
    <meta
      name="twitter:image"
      content="https://www.vibemedianetworks.com/og-image.png"
    />
    <meta
      name="twitter:image:alt"
      content="Vibe Media Networks, a digital talent and media scouting agency"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-white text-slate-900 font-sans antialiased selection:bg-amber-100 selection:text-amber-900 min-h-screen"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
